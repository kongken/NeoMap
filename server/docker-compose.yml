# 本地开发依赖：PostgreSQL 与 Redis。
# 使用非默认端口，避免与本机已有服务冲突。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neomap
      POSTGRES_PASSWORD: neomap
      POSTGRES_DB: neomap
    ports:
      - "5433:5432"
    volumes:
      - neomap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neomap -d neomap"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  neomap-postgres:
