# 生成命令：buf generate（在仓库根目录执行）
# Go 代码输出到 server/gen，TypeScript 代码输出到 src/gen；生成结果纳入版本管理。
version: v2
managed:
  enabled: true
  # protovalidate 的 Go 类型使用官方发布的包（buf.build/go/protovalidate 依赖它），不在本仓库生成
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/kongken/NeoMap/server/gen
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: server/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.10.2
    out: src/gen
    # 不生成依赖（buf/validate）：其 TS 代码含 enum，与 erasableSyntaxOnly 不兼容；
    # 改为引用 @bufbuild/protovalidate 包中已发布的生成代码。
    include_imports: false
    opt:
      - target=ts
      - import_extension=js
      - rewrite_imports=./buf/**/*_pb.js:@bufbuild/protovalidate/gen
