name: Server

# 后端（server/）与 proto 的检查、测试和镜像发布。
# 前端由 Cloudflare Pages 构建，不在这里处理。

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "server/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "src/gen/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "src/gen/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  proto:
    name: Proto lint & generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format --diff --exit-code
      - name: Generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- server/gen src/gen

  test:
    name: Go test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neomap
          POSTGRES_PASSWORD: neomap
          POSTGRES_DB: neomap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neomap -d neomap"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - name: go test (含 PostgreSQL 集成测试)
        env:
          NEOMAP_TEST_POSTGRES_DSN: postgres://neomap:neomap@localhost:5432/neomap?sslmode=disable
        run: go test -race -count=1 ./...

  image:
    name: Docker image
    needs: [proto, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/neomap-api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
